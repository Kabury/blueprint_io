[mod-setting-description]
bpio-damage=If a core fails a check, it will take some damage and needs to be repaired. It can die from this damage.\nIf turned off they won't damage themselves (but can still be damaged by biters).
bpio-consumption=If a core fails a check, it will try to consume all input items and return nothing.\nIf turned off, a failed check just won't give you the outputs but won't consume anything
bpio-colors=If collider confetti should be rainbow colored or monochromatic.

